name: Sports sync hourly

on:
  push:
    branches:
      - main
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "選擇同步模式"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
          
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run sports sync
        run: npm run sync:sports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'incremental' }}
